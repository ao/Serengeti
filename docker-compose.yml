# One node, reachable from this machine only. Set the admin password in .env next to this file:
#   SERENGETI_ADMIN_PASSWORD=at-least-12-characters
# To reach it from another machine, use an SSH tunnel rather than widening the published address.
services:
  serengeti:
    build: .
    image: serengeti:local
    ports:
      - "127.0.0.1:1985:1985"
    volumes:
      - serengeti-data:/data
    environment:
      SERENGETI_ADMIN_PASSWORD: ${SERENGETI_ADMIN_PASSWORD:?set SERENGETI_ADMIN_PASSWORD in .env}
    restart: unless-stopped

volumes:
  serengeti-data:

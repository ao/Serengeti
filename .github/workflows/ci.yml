name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Java ${{ matrix.java }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-java-${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  container:
    name: Container tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t serengeti:it .
      - name: Run the image tests
        run: SKIP_BUILD=1 IMAGE=serengeti:it tests/container/run.sh

  cluster:
    name: Cluster fault tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t serengeti:cluster .
      - name: Kill, partition and slow-disk tests on 3 nodes
        run: SKIP_BUILD=1 IMAGE=serengeti:cluster tests/cluster/run.sh

  edge:
    name: Conformance and limits (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t serengeti:edge .
      - name: HTTP and query language edges, concurrency, kill -9, backup and restore, generated statements
        run: SKIP_BUILD=1 IMAGE=serengeti:edge tests/edge/run.sh

  soak:
    name: Soak, 5 minutes of random faults on 3 nodes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t serengeti:soak .
      - name: Random kills, pauses, partitions and packet loss under client load; then check every node
        env:
          SEED: ${{ github.run_id }}
        run: IMAGE=serengeti:soak NODES=3 DURATION=5 OUT=soak-out tests/soak/run.sh
      - name: Event log, check details and node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak
          path: soak-out/
          if-no-files-found: ignore

  upgrade:
    name: Upgrade from 2.0.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t serengeti:upgrade .
      - name: 2.0.0 data opened by this build; a 3-node cluster upgraded one node at a time
        run: SKIP_BUILD=1 IMAGE=serengeti:upgrade OLD_IMAGE=ataiva/serengeti:2.0.0 tests/upgrade/run.sh

  memory:
    name: Memory limit (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t serengeti:mem .
      - name: Fill a 400 MiB node through its API
        run: SKIP_BUILD=1 IMAGE=serengeti:mem tests/memory/run.sh

  quickstart:
    name: Quick start (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run the quick start from README.md
        run: IMAGE=serengeti:quickstart docs/quickstart.sh

  examples:
    name: Examples (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run the examples
        run: IMAGE=serengeti:examples examples/run.sh

  cluster-example:
    name: Cluster example with Compose (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Certificates, three TLS nodes, a write and a read, one node stopped
        run: IMAGE=serengeti:cluster-example examples/cluster/run.sh

  monitoring-example:
    name: Monitoring example, Prometheus and Grafana (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Alert rule tests, scrapes of three TLS nodes, the dashboard's queries, an alert for a stopped node
        run: IMAGE=serengeti:monitoring-example examples/monitoring/run.sh

  kubernetes:
    name: Kubernetes example on kind (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.10.0
        with:
          install_only: true
      - name: Three pods with TLS, a write on every pod, a pod deleted and back
        run: IMAGE=serengeti:k8s examples/kubernetes/run.sh

  clients:
    name: Python and JavaScript clients (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Both clients against a node, a TLS node and a node that never answers
        run: clients/run.sh

  demo:
    name: Partition demo (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run docs/demo.sh
        run: docs/demo.sh

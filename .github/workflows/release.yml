name: Release

# Runs when a version tag such as v2.0.0 is pushed. The version comes from the tag: the build sets it in
# pom.xml for this run only, so the repository never needs a version commit. See docs/RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Version from the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "tag '$TAG' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE" >&2
            exit 1
          fi
          version=${TAG#v}
          case $version in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Check that CHANGELOG.md has the section before anything is published
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: .github/scripts/release-notes.sh "$VERSION" > /dev/null

  test:
    name: Verify (Java ${{ matrix.java }})
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Set the version from the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: mvn -B -ntp -q org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-java-${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  jar:
    name: Build the jar
    needs: [version, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set the version from the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: mvn -B -ntp -q org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Package
        run: mvn -B -ntp -DskipTests package
      - name: Name the jar, check its version, checksum it
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir dist
          cp "target/Serengeti-$VERSION-jar-with-dependencies.jar" "dist/serengeti-$VERSION.jar"
          reported=$(java -jar "dist/serengeti-$VERSION.jar" --version)
          if [ "$reported" != "$VERSION" ]; then
            echo "the jar reports '$reported', expected '$VERSION'" >&2
            exit 1
          fi
          cd dist && sha256sum "serengeti-$VERSION.jar" > "serengeti-$VERSION.jar.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/

  image:
    name: Image (linux/amd64, linux/arm64)
    needs: [version, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ataiva/serengeti
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub release
    needs: [version, jar, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: .github/scripts/release-notes.sh "$VERSION" > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" dist/* --verify-tag --title "Serengeti ${TAG#v}" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" dist/* --verify-tag --title "Serengeti ${TAG#v}" --notes-file notes.md
          fi
